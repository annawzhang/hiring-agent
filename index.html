<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Hiring Agent · 招聘运营助手</title>
<link rel="stylesheet" href="src/style.css"/>
</head>
<body>
<header class="top">
  <div class="brand"><strong>Hiring Agent</strong><span>招聘运营助手</span></div>
  <span class="badge">只调 Hire 引擎 · 虚构数据 · 规则拒绝会明说</span>
  <div class="chips" id="chips"></div>
</header>
<main>
  <p class="hint">与 <a href="https://annawzhang.github.io/hiring-copilot/">Hiring Copilot</a> 共用同一套评分卡 / 推进 / 反馈规则。
  架构说明见 <a href="https://annawzhang.github.io/people-product-handbook/sections/01-hiring.html">手册 · 结构化招聘</a>。
  不会编造简历；反馈未齐、需复盘会、超名额时推进会被引擎拒绝。</p>
  <div class="log" id="log"></div>
  <form class="composer" id="form">
    <input id="q" placeholder="例如：有哪些超时候选人？ / 初筛 C012 / 推进 C012" autocomplete="off"/>
    <button type="submit">发送</button>
  </form>
</main>
<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script src="src/agent.js"></script>
<script src="src/app.js"></script>
</body>
</html>
